name: build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev libgmp-dev

      - name: Build
        run: make

      - name: Run tests
        run: make test

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev libgmp-dev

      # Catches the leaks and the undefined behaviour that plain tests miss:
      # the test phase allocates and releases every aggregate, so an unbalanced
      # init/clear pair shows up here rather than as a passing test.
      # TESTS is lowered because the sanitizers are slow and memory errors
      # show up in the first iterations, not the hundredth.
      - name: Run tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          make CFLAGS="-O1 -g -march=native -pthread -DTESTS=5 \
            -fsanitize=address,undefined -fno-sanitize-recover=all" test
