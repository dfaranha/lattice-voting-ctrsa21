name: build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FLINT
        uses: ./.github/actions/setup-flint
        with:
          version: v3.6.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Build
        run: make

      - name: Describe the runner
        run: lscpu

      - name: Run tests
        run: |
          # Keep a core file from any test binary that crashes, so that the
          # next step can say where.
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$PWD/core.%e.%p"
          make test

      - name: Backtrace of a crashed test binary
        if: failure()
        run: |
          sudo apt-get install -y gdb
          for c in core.*; do
            [ -e "$c" ] || continue
            b="${c#core.}"
            b="${b%%.*}"
            echo "== $b ($c)"
            gdb -q -batch -ex bt "./$b" "$c"
          done

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FLINT
        uses: ./.github/actions/setup-flint
        with:
          version: v3.6.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: Describe the runner
        run: lscpu

      - name: Run tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          make CFLAGS="-O1 -g -march=native -pthread -DTESTS=5 \
            -fsanitize=address,undefined -fno-sanitize-recover=all" test
